<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الآراء</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gold: #c9a84c; --deep: #0d1b2a; --mid: #1a2f45; --light: #e8dfc8; }

  body {
    font-family: 'Tajawal', sans-serif;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #020509 100%);
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: transparent url("https://www.transparenttextures.com/patterns/stardust.png") repeat;
    opacity: 0.4; z-index: 0;
  }
  body::after {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(white 1px, transparent 1px);
    background-size: 40px 40px;
    animation: starsMove 60s linear infinite;
    opacity: 0.15; z-index: 0;
  }
  @keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(-1000px); }
  }

  .header {
    position: relative; z-index: 5;
    text-align: center; padding: 40px 20px 14px; flex-shrink: 0;
  }
  .title-main {
    font-size: clamp(22px, 4vw, 36px); font-weight: 900;
    color: var(--gold); letter-spacing: 1px;
    text-shadow: 0 0 30px rgba(201,168,76,0.3);
  }
  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 10px auto 0; border-radius: 2px;
  }

  #stage { flex: 1; position: relative; z-index: 2; overflow: hidden; padding: 10px; }

  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: rgba(232,223,200,0.2); pointer-events: none; transition: opacity 0.5s;
  }
  .empty-state.hidden { opacity: 0; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-text { font-size: 15px; font-weight: 300; letter-spacing: 1px; }

  .logo {
    position: fixed; top: 20px; right: 20px;
    width: 80px; z-index: 10;
    background: #ffffff; padding: 10px;
    border-radius: 40%;
    border: 2px solid rgba(201,168,76,0.5);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    object-fit: contain;
  }

  .vision-card {
    position: absolute; border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    border: 1.5px solid rgba(201,168,76,0.2);
    transform-origin: center center;
    background: var(--mid);
  }
  .vision-card img {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
    background: #f5f0e8;
  }
  .vision-card .card-num {
    position: absolute; top: 6px; right: 8px;
    background: rgba(201,168,76,0.9);
    color: var(--deep); font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 20px;
  }
  .card-new {
    position: absolute; top: 6px; left: 8px;
    background: rgba(76,175,80,0.9);
    color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 20px;
    animation: fadeOutBadge 3s forwards;
  }
  @keyframes fadeOutBadge { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

  .vision-card:hover .card-download { opacity: 1; }
  .card-download {
    position: absolute; bottom: 6px; left: 8px;
    opacity: 0; transition: opacity 0.2s;
    background: rgba(13,27,42,0.85);
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 6px; padding: 3px 8px;
    font-size: 11px; color: var(--gold);
    cursor: pointer; font-family: 'Tajawal', sans-serif; z-index: 5;
  }

  /* شريط الحالة العلوي */
  #top-bar {
    position: fixed; top: 14px; left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex; align-items: center; gap: 10px;
    background: rgba(13,27,42,0.9);
    border: 1.5px solid rgba(201,168,76,0.25);
    border-radius: 30px; padding: 7px 20px;
    backdrop-filter: blur(8px);
  }

  .btn-fs {
    position: fixed; bottom: 18px; left: 18px; z-index: 20;
    background: rgba(26,47,69,0.9);
    border: 1.5px solid rgba(201,168,76,0.3);
    border-radius: 8px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; backdrop-filter: blur(4px);
  }
  .btn-fs svg { width: 18px; height: 18px; stroke: var(--gold); fill: none; }

  #conn-status {
    position: fixed; bottom: 18px; right: 18px; z-index: 20;
    font-size: 12px; color: rgba(201,168,76,0.5);
    display: flex; align-items: center; gap: 6px;
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: scale(0.5) rotate(-5deg); }
    to { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
  }
  @keyframes zoomPulse {
    0%   { transform: scale(1) rotate(var(--rot,0deg)); z-index:10; }
    40%  { transform: scale(2.2) rotate(var(--rot,0deg)); z-index:10; box-shadow: 0 25px 70px rgba(0,0,0,0.8), 0 0 0 3px rgba(201,168,76,0.8); }
    70%  { transform: scale(2.2) rotate(var(--rot,0deg)); z-index:10; }
    100% { transform: scale(1) rotate(var(--rot,0deg)); z-index:3; }
  }
</style>
</head>
<body>

<img src="logo.png" class="logo" alt="شعار">

<div class="header">
  <div class="title-main">رؤية تتحقق بخطوات واثقة</div>
  <div class="divider"></div>
</div>

<div id="stage">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">✦</div>
    <div class="empty-text">في انتظار رؤيتك...</div>
  </div>
</div>


<button class="btn-fs" onclick="toggleFS()">
  <svg id="fs-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
  </svg>
</button>

<script>
  // ======================================================
  // 🔧 ضعي الـ Token الجديد هنا فقط
  // ======================================================
  const GITHUB_TOKEN  = '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';
  const GITHUB_OWNER  = 'itsHamida';
  const GITHUB_REPO   = 'alburhan';
  const GITHUB_FOLDER = 'drawings';
  const POLL_INTERVAL = 3000; // كل 5 ثواني
  // ======================================================

  let galleryEntries = [];
  let cardElements = [];
  let zoomInterval = null;
  let currentZoomIndex = 0;
  let knownFiles = new Set(); // ملفات نعرفها مسبقاً
  let isFirstLoad = true;

  const pollDot   = document.getElementById('poll-dot');
  const pollLabel = document.getElementById('poll-label');
  const newNotif  = document.getElementById('new-notif');

  // جلب قائمة الملفات من GitHub
  async function fetchDrawings() {
    try {
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}`,
        {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Cache-Control': 'no-cache'
          }
        }
      );

      if (res.status === 404) {
        // المجلد مش موجود بعد — طبيعي قبل أول رسمة
        pollDot.classList.add('live');
        isFirstLoad = false;
        return;
      }

      if (!res.ok) throw new Error('GitHub API error: ' + res.status);

      const files = await res.json();
      pollDot.classList.add('live');

      // رتّب الملفات من الأقدم للأحدث
      const jpgFiles = files
        .filter(f => f.name.endsWith('.jpg') || f.name.endsWith('.png'))
        .sort((a, b) => a.name.localeCompare(b.name));

      let newCount = 0;

      for (const file of jpgFiles) {
        if (knownFiles.has(file.sha)) continue;
        knownFiles.add(file.sha);

        // جلب محتوى الصورة
        const imgRes = await fetch(file.download_url, {
          headers: { 'Cache-Control': 'no-cache' }
        });
        const blob = await imgRes.blob();
        const dataURL = await blobToDataURL(blob);

        const isNew = !isFirstLoad;
        addCard({ image: dataURL, name: file.name }, isNew);

        // تنزيل تلقائي للصور الجديدة فقط
        if (isNew) {
          newCount++;
          autoDownload(dataURL, file.name);
        }
      }
      isFirstLoad = false;

    } catch(err) {
      console.error('Poll error:', err);
    }
  }

  function blobToDataURL(blob) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  }

  function autoDownload(dataURL, filename) {
    setTimeout(() => {
      const link = document.createElement('a');
      link.download = filename;
      link.href = dataURL;
      link.click();
    }, 800);
  }


  // ── Layout ──────────────────────────────────────────

  function getStageRect() {
    const s = document.getElementById('stage');
    return { w: s.offsetWidth, h: s.offsetHeight };
  }

  function getCardSizeRange(n) {
    let maxW, maxH, minW, minH;
    if (n <= 30)      { maxW=240; maxH=180; minW=120; minH=90; }
    else if (n <= 70) { maxW=180; maxH=135; minW=100; minH=75; }
    else              { maxW=140; maxH=105; minW=80;  minH=60; }
    const { w, h } = getStageRect();
    return {
      minW: Math.min(minW, w*0.12), maxW: Math.min(maxW, w*0.35),
      minH: Math.min(minH, h*0.12), maxH: Math.min(maxH, h*0.35)
    };
  }

  function computeLayout(n) {
    const { w, h } = getStageRect();
    const pad = 15, topSafe = Math.max(80, h*0.18);
    if (n === 0) return [];
    if (n === 1) {
      const { maxW, maxH } = getCardSizeRange(1);
      const cw = Math.min(w*0.5, maxW), ch = Math.min(h*0.5, maxH);
      return [{ x:(w-cw)/2, y:(h-ch)/2+topSafe/2, w:cw, h:ch, rot:0 }];
    }
    const { minW, maxW, minH, maxH } = getCardSizeRange(n);
    const layouts = [];
    let attempts = 0;
    while (layouts.length < n && attempts < n*150) {
      attempts++;
      const cw = minW + Math.random()*(maxW-minW);
      const ch = minH + Math.random()*(maxH-minH);
      const rot = (Math.random()-0.5)*8;
      const zone = Math.random();
      let x, y;
      const minX=pad, maxX=w-cw-pad, minY=topSafe, maxY=h-ch-pad;
      if (zone < 0.33)      x = minX + Math.random()*(Math.min(maxX, w*0.3)-minX);
      else if (zone < 0.66) x = Math.max(minX, Math.min(maxX, w*0.35+Math.random()*w*0.3));
      else                  x = Math.max(minX, w*0.7) + Math.random()*(maxX-Math.max(minX, w*0.7));
      x = Math.min(maxX, Math.max(minX, x));
      y = Math.min(maxY, Math.max(minY, minY+Math.random()*(maxY-minY)));
      let overlap = false;
      for (const l of layouts) {
        const iw = Math.min(x+cw, l.x+l.w) - Math.max(x, l.x);
        const ih = Math.min(y+ch, l.y+l.h) - Math.max(y, l.y);
        if (iw>0 && ih>0 && (iw*ih)/(cw*ch) > 0.02) { overlap=true; break; }
      }
      if (!overlap) layouts.push({ x, y, w:cw, h:ch, rot });
    }
    while (layouts.length < n) {
      const cw = minW+Math.random()*(maxW-minW), ch = minH+Math.random()*(maxH-minH);
      layouts.push({
        x: pad+Math.random()*(w-cw-2*pad),
        y: topSafe+Math.random()*(h-ch-topSafe),
        w:cw, h:ch, rot:(Math.random()-0.5)*8
      });
    }
    return layouts;
  }

  function applyLayoutToAll(animateLast=false) {
    if (!galleryEntries.length) return;
    const layouts = computeLayout(galleryEntries.length);
    cardElements.forEach((el, i) => {
      const l = layouts[i]; if (!el||!l) return;
      el.style.setProperty('--rot', `${l.rot}deg`);
      el.style.left = l.x+'px'; el.style.top = l.y+'px';
      el.style.width = l.w+'px'; el.style.height = l.h+'px';
      if (animateLast && i===cardElements.length-1) {
        el.style.animation='none'; el.offsetHeight;
        el.style.animation='cardEnter 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards';
      } else {
        el.style.transform = `rotate(${l.rot}deg)`;
      }
    });
  }

  function addCard(entryData, isNew=true) {
    const stage = document.getElementById('stage');
    const idx = galleryEntries.length;
    const card = document.createElement('div');
    card.className = 'vision-card';
    card.style.cssText = 'position:absolute; z-index:3;';
    card.innerHTML = `
      <img src="${entryData.image}" alt="رؤية ${idx+1}">
      <div class="card-num">${idx+1}</div>
      ${isNew && idx>0 ? '<div class="card-new">جديد</div>' : ''}
      <button class="card-download" onclick="downloadCard(${idx})">⬇ تحميل</button>
    `;
    stage.appendChild(card);
    cardElements.push(card);
    galleryEntries.push(entryData);
    document.getElementById('emptyState').classList.add('hidden');
    applyLayoutToAll(isNew);
    startZoomCycle();
  }

  window.downloadCard = function(idx) {
    const entry = galleryEntries[idx]; if (!entry) return;
    const link = document.createElement('a');
    link.download = entry.name || `opinion_${idx+1}.jpg`;
    link.href = entry.image; link.click();
  };

  function startZoomCycle() {
    if (zoomInterval) clearInterval(zoomInterval);
    if (!galleryEntries.length) return;
    currentZoomIndex = 0; doZoom();
    zoomInterval = setInterval(() => {
      if (!galleryEntries.length) { clearInterval(zoomInterval); return; }
      currentZoomIndex = (currentZoomIndex+1) % galleryEntries.length;
      doZoom();
    }, 3500);
  }

  function doZoom() {
    const el = cardElements[currentZoomIndex]; if (!el) return;
    el.style.animation='none'; el.offsetHeight;
    el.style.animation='zoomPulse 3s ease-in-out forwards';
    el.style.zIndex=10;
    setTimeout(() => { if(el) el.style.zIndex=3; }, 3000);
  }

  function toggleFS() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  window.addEventListener('resize', () => { if(galleryEntries.length) applyLayoutToAll(false); });

  // ── بدء التحقق الدوري ──
  fetchDrawings();
  setInterval(fetchDrawings, POLL_INTERVAL);
</script>
</body>
</html>
